name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lower bound is the minimum supported by the package; the upper
        # bound is what production runs.
        node: ['20.11', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  install-from-git:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # reptiles.ge consumes this straight from the repository, so a consumer
      # install is exercised the way they perform it: clone, prepare, pack.
      # Nothing here reuses the working tree, because the failure this guards
      # against is dist/ never reaching the tarball.
      - name: Install this commit as a dependency
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm pkg set type=module > /dev/null
          npm install "git+file://$GITHUB_WORKSPACE#$GITHUB_SHA"

      - name: Resolve every entry point
        run: |
          cd "$RUNNER_TEMP/consumer"
          node -e "import('@reptiles-ge/img-compression').then(m => { if (!m.optimizeAndStore) throw new Error('root entry point is missing optimizeAndStore'); })"
          node -e "import('@reptiles-ge/img-compression/storage').then(m => { if (!m.createStorageFromEnv) throw new Error('storage entry point is missing createStorageFromEnv'); })"
          ./node_modules/.bin/reptiles-images --help > /dev/null

      # The delivery component is behind an optional peer, so it must resolve
      # once React is present and must not be required before then.
      - name: Resolve the delivery component
        run: |
          cd "$RUNNER_TEMP/consumer"
          npm install react react-dom
          node -e "import('@reptiles-ge/img-compression/next').then(m => { if (!m.OptimizedImage) throw new Error('next entry point is missing OptimizedImage'); })"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # This package decodes untrusted images, so a libvips advisory reaching
      # sharp is a production concern rather than a housekeeping chore.
      - name: Audit dependencies
        run: npm audit --audit-level=high
